<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nivesha Ventures</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#101f2e;font:15px/1.45 Arial,sans-serif}iframe{width:100%;height:100dvh;border:0;display:block}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #aa916b;background:#fffaf0;color:#142536;border-radius:5px;padding:8px 11px}button:focus-visible,textarea:focus-visible{outline:3px solid #a67724}#launch,.primary{background:#101e2d;color:white}#launch{position:fixed;bottom:18px;right:18px;border-radius:24px;padding:12px 19px}#panel{position:fixed;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100dvh - 32px));background:#faf6ee;border:1px solid #b5a487;border-radius:12px;box-shadow:0 12px 48px #101e2d36;display:flex;flex-direction:column;overflow:hidden}#panel[hidden]{display:none}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#101e2d;color:white}h2{font:24px Georgia,serif;margin:0}#flow{overflow:auto;flex:1;padding:14px}p{margin:0 0 10px}.bubble{padding:10px;border-left:3px solid #aa916b;background:white;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.user{background:#e7eee9;border-color:#537467}#starters{display:grid;gap:6px}form{border-top:1px solid #d9cdb9;padding:12px}textarea{width:100%;resize:vertical;min-height:58px;padding:8px}footer{display:flex;align-items:center;justify-content:space-between;gap:10px}small{color:#4e5c60}button:disabled{opacity:.6}
</style>
<iframe src="/homepage.html" title="Nivesha Ventures homepage"></iframe>
<button id="launch" aria-controls="panel" aria-expanded="false">Ask Nivesha</button>
<section id="panel" role="region" aria-label="Investor assistant" hidden><header><h2>Ask Nivesha</h2><button id="closeChat" aria-label="Close chat">Close</button></header><div id="flow"><p>What would you like to check before meeting a founder?</p><div id="starters"></div><div id="log" role="log" aria-live="polite"></div></div><form><label for="msg">Your question or approved meeting notes</label><textarea id="msg" maxlength="5000" required></textarea><footer><small>Illustrative cases · Use demo information</small><button class="primary" id="send">Send</button></footer></form></section><script src="/chat.js"></script></html>
